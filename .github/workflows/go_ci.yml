name: Go CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    # Use the same transparent sequence as build.sh.
    - name: All packages - Go Fmt Check
      run: |
        # If gofmt prints a filename, that file needs formatting.
        ! gofmt -l . | grep -q .

    - name: All packages - Unit Tests
      run: go test ./...

    - name: All packages - Go Vet
      run: go vet ./...

    - name: All packages - Go Build
      run: go build ./...
